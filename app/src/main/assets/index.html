<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Battery Nag</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{padding:24px 18px calc(32px + env(safe-area-inset-bottom));overflow-y:auto}
.wrap{width:100%;max-width:520px;margin:0 auto}
h1{font-size:36px;line-height:1;margin:8px 0 12px;font-weight:900;letter-spacing:-1px}
.status{font-size:28px;font-weight:800;text-align:center;padding:22px 12px;border:1px solid #333;border-radius:16px;margin:18px 0}
.copy{text-align:center;color:#bbb;font-size:15px;line-height:1.45;margin:0 4px 18px}
label{display:block;color:#aaa;font-size:13px;font-weight:800;margin:18px 0 8px}
input{display:block;width:100%;min-height:56px;padding:14px 16px;border:1px solid #555;border-radius:12px;background:#111;color:#fff;font-size:17px;outline:none}
button{display:block;width:100%;min-height:56px;margin:12px 0;padding:14px 18px;border:0;border-radius:12px;background:#fff;color:#000;font-size:15px;font-weight:900;letter-spacing:.02em;white-space:normal}
button:active{transform:scale(.99)}
.playlist{background:#fff;color:#000}
.video{width:100%;aspect-ratio:16/9;background:#111;border:1px solid #333;border-radius:16px;overflow:hidden;margin:8px 0 18px}.video iframe{width:100%;height:100%;border:0;display:block}
.hint{text-align:center;color:#888;font-size:13px;margin:12px 0 22px}
.divider{height:1px;background:#252525;margin:24px 0}
.snooze-title{text-align:center;color:#aaa;font-size:13px;font-weight:800;margin-bottom:10px}
.snooze-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.snooze-grid button{margin:0;background:#171717;color:#fff;border:1px solid #333}
#result{text-align:center;min-height:22px;color:#bbb;font-size:14px;padding:4px 8px}
.selftest-out{text-align:left;color:#8f8;font-size:12px;line-height:1.6;background:#0b0b0b;border:1px solid #333;border-radius:12px;padding:14px;white-space:pre-wrap;margin:10px 0 4px;word-break:break-word}
@media(max-width:360px){body{padding-left:14px;padding-right:14px}h1{font-size:32px}.snooze-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>BATTERY NAG</h1>
<div class="video"><iframe id="youtubePlayer" width="560" height="315" src="https://www.youtube.com/embed/JWdZEumNRmI?si=dt8qemMfc017Mn77&playsinline=1&rel=0&origin=https%3A%2F%2Fopen.songslike.com" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
<div id="status" class="status">Battery: --%</div>
<p class="copy">Warns below 30% and gets more frequent as the battery falls.</p>
<button class="playlist" onclick="openPlaylist()">OPEN THE I'M ALL OUT OF LOVE PLAYLIST</button>
<label for="email">EMAIL FOR ALERTS</label>
<input id="email" type="email" autocomplete="email" placeholder="Your email address">
<button onclick="registerEmail()">REGISTER FOR ALERTS</button>
<div id="result"></div>
<p class="hint">Your address is saved on this device and registered with Battery Nag.</p>
<label for="phone">PHONE FOR LOW-BATTERY CALLS</label>
<input id="phone" type="tel" autocomplete="tel" placeholder="+1 555 123 4567">
<button onclick="savePhone()">SAVE PHONE NUMBER</button>
<div class="divider"></div>
<div class="snooze-title">IGNORE WARNINGS FOR:</div>
<div class="snooze-grid">
<button onclick="snooze(1)">1 HOUR</button>
<button onclick="snooze(2)">2 HOURS</button>
<button onclick="snooze(3)">3 HOURS</button>
<button onclick="snooze(4)">4 HOURS</button>
<button onclick="snooze(5)">5 HOURS</button>
</div>
<div class="divider"></div>
<div class="snooze-title">DIAGNOSTICS</div>
<button onclick="runSelfTest()">RUN THE NAG SELF TEST</button>
<div id="selftest" class="selftest-out" style="display:none"></div>
</div>
<script>
function setStatus(text){document.getElementById('status').textContent=text}
function setResult(text){document.getElementById('result').textContent=text}
function refresh(){if(window.BatteryNag){setStatus(BatteryNag.getStatus())}}
function openPlaylist(){if(window.BatteryNag){BatteryNag.openPlaylist()}else{window.location.href='https://open.songslike.com/battery+nag'}}
function registerEmail(){
 const email=document.getElementById('email').value.trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setResult('Enter a valid email address.');return}
 setResult('Registering...');
 BatteryNag.registerEmail(email);
}
function savePhone(){
 const phone=document.getElementById('phone').value.trim();
 if(!/^[+\d][\d ()-]{6,}$/.test(phone)){setResult('Enter a valid phone number.');return}
 if(window.BatteryNag){BatteryNag.setCallNumber(phone);setResult('Phone number saved for low-battery calls.')}
 else{setResult('Phone number can only be saved in the Android app.')}
}
function onRegistrationResult(ok,message){setResult(message)}
function onSongslikeVideoResults(videoIds){
 if(!Array.isArray(videoIds)){return}
 const ids=videoIds.filter(id=>/^[A-Za-z0-9_-]{11}$/.test(id));
 if(!ids.length){return}
 const player=document.getElementById('youtubePlayer');
 if(player){
  const playlist=ids.join(',');
  player.src='https://www.youtube.com/embed/'+encodeURIComponent(ids[0])+'?playlist='+encodeURIComponent(playlist)+'&playsinline=1&rel=0&origin=https%3A%2F%2Fopen.songslike.com';
 }
}
function snooze(hours){BatteryNag.snooze(hours);setResult('Warnings snoozed for '+hours+' hour'+(hours===1?'':'s')+'.');refresh()}
function runSelfTest(){
 const box=document.getElementById('selftest');
 box.style.display='block';
 box.textContent='running...';
 if(!window.BatteryNag){box.textContent='The self test only runs inside the Android app.';return}
 // The bridge call blocks while the test email is sent, so let the
 // "running" message paint before it freezes the page.
 setTimeout(function(){
  try{box.textContent=BatteryNag.selfTest()}
  catch(e){box.textContent='self test failed: '+e}
 },80);
}
window.onRegistrationResult=onRegistrationResult;
window.onSongslikeVideoResults=onSongslikeVideoResults;
document.addEventListener('DOMContentLoaded',refresh);
document.addEventListener('DOMContentLoaded',function(){
 if(window.BatteryNag){BatteryNag.searchSongslike('im all out of love')}
});
</script>
</body>
</html>
