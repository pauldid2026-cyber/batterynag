<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Battery Nag</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}

/* Fullscreen YouTube background */
#bg-video{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  pointer-events:none;
  z-index:0;
}
#bg-video iframe{
  width:100%;height:100%;border:none;
}

/* Floating UI layer */
.wrap{
  position:relative;
  z-index:10;
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* Semi-transparent panels for readability */
.panel{
  background:rgba(0,0,0,0.75);
  border-radius:16px;
  padding:18px 16px;
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.08);
}
.panel.compact{padding:14px 16px}

h1{font-size:28px;line-height:1;margin:0 0 8px;font-weight:900;letter-spacing:-1px;text-align:center}
.status{font-size:22px;font-weight:800;text-align:center;padding:14px 10px;border:1px solid #333;border-radius:12px;margin:0 0 10px;background:rgba(0,0,0,0.6)}
.copy{text-align:center;color:#bbb;font-size:14px;line-height:1.4;margin:0 0 12px}

label{display:block;color:#aaa;font-size:12px;font-weight:800;margin:12px 0 6px}
input{display:block;width:100%;min-height:48px;padding:12px 14px;border:1px solid #555;border-radius:10px;background:#111;color:#fff;font-size:16px;outline:none}

button{display:block;width:100%;min-height:48px;margin:10px 0;padding:12px 16px;border:0;border-radius:10px;background:#fff;color:#000;font-size:14px;font-weight:900;letter-spacing:.02em;white-space:normal}
button:active{transform:scale(.99)}
button.pay{background:#9dff3c;color:#000;margin-bottom:6px}
button.secondary{background:#1a1a1a;color:#fff;border:1px solid #333}
button.secondary.on{background:#fff;color:#000;border-color:#fff}

.snooze-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.snooze-grid button{margin:0;min-height:44px;padding:10px;font-size:13px}

.source-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.source-grid button{margin:0;min-height:40px;padding:8px;font-size:12px}

#result{text-align:center;min-height:20px;color:#bbb;font-size:13px;padding:4px 8px}
.hint{text-align:center;color:#888;font-size:12px;margin:8px 0 0}

.divider{height:1px;background:rgba(255,255,255,0.08);margin:16px 0}

.track-list{max-height:280px;overflow:auto;padding:4px}
.track-item{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer}
.track-item:last-child{border-bottom:none}
.track-item:active{background:rgba(255,255,255,0.08)}
.track-name{font-weight:600;font-size:14px;color:#fff}
.track-meta{color:#888;font-size:11px;margin-top:2px}

.selftest-out{text-align:left;color:#8f8;font-size:11px;line-height:1.5;background:rgba(0,0,0,0.8);border:1px solid #333;border-radius:12px;padding:12px;white-space:pre-wrap;margin:10px 0 0;word-break:break-word;max-height:180px;overflow:auto}

@media(max-width:360px){
  h1{font-size:24px}
  .source-grid{grid-template-columns:1fr 1fr 1fr}
  .wrap{padding:10px 12px}
}
</style>
</head>
<body>
<!-- Fullscreen YouTube background -->
<div id="bg-video">
  <iframe
    src="https://www.youtube.com/embed/JWdZEumNRmI?autoplay=1&mute=1&loop=1&playlist=JWdZEumNRmI&playsinline=1&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&origin=https%3A%2F%2Fopen.songslike.com"
    title="Battery Nag background"
    allow="autoplay; encrypted-media; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>
</div>

<!-- Floating UI -->
<div class="wrap">
  <!-- Top section: status + email/phone -->
  <div class="panel">
    <h1>BATTERY NAG</h1>
    <div id="status" class="status">Battery: --%</div>
    <p class="copy">Warns below 30% and gets more frequent as the battery falls.</p>

    <button class="pay" onclick="openPayment()">UPGRADE NOW - $4.99 (One-time)</button>

    <label for="email">EMAIL FOR ALERTS</label>
    <input id="email" type="email" autocomplete="email" placeholder="Your email address">
    <button onclick="registerEmail()">REGISTER FOR ALERTS</button>

    <label for="phone">PHONE FOR LOW-BATTERY CALLS</label>
    <input id="phone" type="tel" autocomplete="tel" placeholder="+1 555 123 4567">
    <button onclick="savePhone()">SAVE PHONE NUMBER</div>

  <!-- Middle section: snooze + source picker + track list -->
  <div class="panel" style="flex:1;min-height:0;display:flex;flex-direction:column">
    <div class="divider"></div>
    <div class="snooze-title">IGNORE WARNINGS FOR:</div>
    <div class="snooze-grid">
      <button onclick="snooze(1)">1 HOUR</button>
      <button onclick="snooze(2)">2 HOURS</button>
      <button onclick="snooze(3)">3 HOURS</button>
      <button onclick="snooze(4)">4 HOURS</button>
      <button onclick="snooze(5)">5 HOURS</button>
    </div>

    <div class="divider"></div>
    <div class="snooze-title" style="margin-bottom:6px">SONG SOURCE:</div>
    <div class="source-grid">
      <button id="srcFreeai" class="secondary" onclick="setSource('freeai')">FREE AI</button>
      <button id="srcJukebox" class="secondary" onclick="setSource('jukebox')">JUKEBOX</button>
      <button id="srcBoth" class="secondary" onclick="setSource('both')">BOTH</button>
    </div>
    <p class="hint" id="sourcehint" style="margin-top:6px;margin-bottom:0">Fresh AI-picked songs, replaced with new ones every night.</p>

    <div class="divider"></div>
    <div class="snooze-title">CURRENT NAG TRACKS</div>
    <div id="tracklist" class="track-list" style="display:none">
      <div style="padding:10px;color:#888;text-align:center">Loading tracks…</div>
    </div>
  </div>

  <!-- Bottom section: status messages -->
  <div class="panel compact">
    <div id="result"></div>
    <div id="trackstock" class="selftest-out" style="display:none"></div>
  </div>
</div>

<script>
function setStatus(text){document.getElementById('status').textContent=text}
function setResult(text){document.getElementById('result').textContent=text}
function refresh(){if(window.BatteryNag){setStatus(BatteryNag.getStatus())}}
function showTrackStatus(line){
 const box=document.getElementById('trackstock');
 if(!box){return}
 if(!line){box.style.display='none';box.textContent='';return}
 const short=line.indexOf('NEW MP3s NEEDED')>=0;
 box.style.display='block';
 box.style.color=short?'#f77':'#8f8';
 box.textContent='TRACKS - '+line;
}
function refreshTrackStatus(){
 if(window.BatteryNag){
  try{showTrackStatus(BatteryNag.trackStatus())}catch(e){}
 }
}
function markSource(s){
 const onFreeai=(s==='freeai');
 const onJukebox=(s==='jukebox');
 const onBoth=(s==='both');
 const f=document.getElementById('srcFreeai');
 const j=document.getElementById('srcJukebox');
 const b=document.getElementById('srcBoth');
 if(f){f.classList.toggle('on',onFreeai || onBoth)}
 if(j){j.classList.toggle('on',onJukebox || onBoth)}
 if(b){b.classList.toggle('on',onBoth)}
 const hint=document.getElementById('sourcehint');
 if(hint){
  hint.textContent=(
   s==='both'
    ?'Songs from both the Jukebox and Free AI - played in random order.'
   :(s==='jukebox')
    ?'Whatever has been added to the Charge Your Phone jukebox. Played as one pool, no levels.'
    :'Fresh AI-picked songs, replaced with new ones every night.'
  );
 }
 try{showTrackList()}catch(e){}
}
function showNotificationSettings(){
 if(!window.BatteryNag){return}
 try{
  if(typeof BatteryNag.showNotificationSettings==='function'){BatteryNag.showNotificationSettings()}
 }catch(e){}
}
function renderTrackList(tracksJson){
 const box=document.getElementById('tracklist');
 if(!box){return}
 try{
  const tracks=JSON.parse(tracksJson||'[]');
  if(!tracks.length){box.innerHTML='<div style="padding:10px;color:#888;text-align:center">No tracks cached yet</div>';box.style.display='block';return}
  box.innerHTML=tracks.map(function(t){
   const id=String(t.id||'').replace(/'/g,'');
   const src=String(t.source||'').replace(/'/g,'');
   const bucket=String(t.bucket||'').replace(/'/g,'');
   const disp=String(t.display||id).replace(/</g,'<');
   const srcLabel = src==='jukebox'?'JUKEBOX':src==='freeai'?'FREE AI':'DEFAULT';
   return '<div class="track-item" onclick="playTrack(\''+id+'\',\''+src+'\','+bucket+')">'
     +'<div class="track-name">'+disp+'</div>'
     +'<div class="track-meta">['+bucket+'%] Source: '+srcLabel+'</div>'
     +'</div>';
  }).join('');
  box.style.display='block';
 }catch(e){box.innerHTML='<div style="padding:10px;color:#f77;text-align:center">Error loading tracks</div>';box.style.display='block'}
}
function showTrackList(){
 if(!window.BatteryNag){return}
 var res;
 try{res=BatteryNag.getCurrentTracks()}catch(e){
  const box=document.getElementById('tracklist');
  if(box){box.innerHTML='<div style="padding:10px;color:#f77;text-align:center">Error loading tracks</div>';box.style.display='block'}
  return
 }
 if(res&&typeof res.then==='function'){res.then(renderTrackList).catch(function(){renderTrackList('[]')})}
 else{renderTrackList(res)}
}
function playTrack(id,source,bucket){
 setResult('Previewing '+(id||'track')+'…');
 if(!window.BatteryNag){return}
 try{
  if(typeof BatteryNag.playSpecificTrack==='function'){
   var out=BatteryNag.playSpecificTrack(id,source,bucket);
   if(out){setResult(out)}
  }else if(typeof BatteryNag.playSong==='function'){
   var out=BatteryNag.playSong();
   if(out){setResult(out)}
  }
 }catch(e){setResult('Could not preview track.')}
}
function snooze(h){
 if(!window.BatteryNag){return}
 try{BatteryNag.snooze(h);setResult('Warnings snoozed for '+h+' hour(s).');refresh()}catch(e){}
}
function setSource(s){
 markSource(s);
 if(!window.BatteryNag){return}
 try{
  BatteryNag.setSongSource(s);
  // Wait for the async refresh to download tracks, then re-render
  setTimeout(function(){ showTrackList(); }, 1500);
  setTimeout(function(){ showTrackList(); }, 4000);
 }catch(e){}
}
function initSource(){
 markSource(window.BatteryNag?BatteryNag.getSongSource():'freeai');
 // Trigger initial refresh so tracks appear on first load
 if(window.BatteryNag){
  try{BatteryNag.setSongSource(BatteryNag.getSongSource())}catch(e){}
 }
 setTimeout(function(){ showTrackList(); }, 2000);
 setTimeout(function(){ showTrackList(); }, 5000);
}
function openPlaylist(){if(window.BatteryNag){BatteryNag.openPlaylist()}else{window.location.href='https://open.songslike.com/battery+nag'}}
function registerEmail(){
 const email=document.getElementById('email').value.trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setResult('Enter a valid email address.');return}
 setResult('Registering…');
 BatteryNag.registerEmail(email);
}
function savePhone(){
 const phone=document.getElementById('phone').value.trim();
 if(!/^[+\d][\d ()-]{6,}$/.test(phone)){setResult('Enter a valid phone number.');return}
 if(window.BatteryNag){BatteryNag.setCallNumber(phone);setResult('Phone number saved for low-battery calls.')}
 else{setResult('Phone number can only be saved in the Android app.')}
}
function openPayment(){
 if(window.BatteryNag && typeof BatteryNag.openPayment==='function'){
  BatteryNag.openPayment();
 }else{
  window.location.href='https://open.songslike.com/batterynag.php';
 }
}
function onRegistrationResult(ok,msg){setResult(msg||(ok?'Registered.':'Registration failed.'))}
function onSongslikeVideoResults(ids){
 try{
  var list=JSON.parse(ids||'[]');
  if(list&&list.length){
   var f=document.getElementById('youtubePlayer');
   if(f){f.src='https://www.youtube.com/embed/'+list[0]+'?autoplay=1&mute=1&loop=1&playlist='+list[0]+'&playsinline=1&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3'}
  }
 }catch(e){}
}
window.onRegistrationResult=onRegistrationResult;
window.onSongslikeVideoResults=onSongslikeVideoResults;
window.onTrackStatus=showTrackStatus;
document.addEventListener('DOMContentLoaded',function(){refresh();initSource();refreshTrackStatus();showTrackList();});
</script>
</body>
</html>
