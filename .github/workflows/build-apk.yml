name: Build Battery Nag APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle assembleRelease
        env:
          BATTERY_NAG_SIGNING_SECRET: ${{ secrets.BATTERY_NAG_SIGNING_SECRET }}

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryNag-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Deploy APK to website
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key.pem
          chmod 600 /tmp/deploy_key.pem
          scp -i /tmp/deploy_key.pem app/build/outputs/apk/release/app-release.apk ${SSH_USER}@${SSH_HOST}:/var/www/html/mediasuggestionengine/batterynag.apk
          ssh -i /tmp/deploy_key.pem ${SSH_USER}@${SSH_HOST} "chmod 644 /var/www/html/mediasuggestionengine/batterynag.apk"