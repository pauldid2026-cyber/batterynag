name: Build Battery Nag APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle assembleRelease
        env:
          BATTERY_NAG_SIGNING_SECRET: ${{ secrets.BATTERY_NAG_SIGNING_SECRET }}

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryNag-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-release@v2
        with:
          tag_name: battery-nag-${{ github.sha }}
          name: "Battery Nag Build ${{ github.sha[:8] }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

      - name: Upload APK asset to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          file: app/build/outputs/apk/release/app-release.apk
          asset_name: batterynag-${{ github.sha[:8] }}.apk
          asset_type: application/vnd.android.package-archive
          asset_label: APK